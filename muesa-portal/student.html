<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUESA Student Portal</title>
  <link rel="icon" type="image/png" href="muesa bg.png">
  <style>
    :root { --navy: #123047; --teal: #008c95; --orange: #e87835; --paper: #f4f7f6; --line: #d8e2e1; --ink: #17333b; --muted: #60767a; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: var(--ink); font-family: "Trebuchet MS", "Segoe UI", sans-serif; background: var(--paper); background-image: linear-gradient(135deg, rgba(0,140,149,.07) 25%, transparent 25%), linear-gradient(315deg, rgba(18,48,71,.05) 25%, transparent 25%); background-size: 34px 34px; }
    .shell { width: min(100% - 32px, 980px); margin: 0 auto; padding: 28px 0 46px; }
    .topbar, .panel { background: white; border: 1px solid var(--line); box-shadow: 0 12px 30px rgba(18,48,71,.08); border-radius: 8px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 16px 20px; margin-bottom: 20px; }
    .brand { display: flex; align-items: center; gap: 12px; } .brand img { width: 48px; height: 48px; object-fit: contain; }
    h1, h2, p { margin-top: 0; } h1 { color: var(--navy); font-size: clamp(24px, 4vw, 36px); margin-bottom: 4px; } h2 { color: var(--navy); margin-bottom: 5px; } .eyebrow { color: var(--orange); font-size: 11px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; } .muted { color: var(--muted); font-size: 14px; }
    .btn { border: 0; border-radius: 5px; padding: 11px 15px; font-weight: 800; cursor: pointer; font-size: 13px; } .btn-primary { color: white; background: var(--teal); } .btn-quiet { color: var(--navy); background: #e9f0ef; text-decoration: none; display: inline-block; }
    .login { max-width: 450px; margin: 10vh auto 0; padding: 34px; } .login-logo { display: block; width: 92px; height: 92px; object-fit: contain; margin: 0 auto 14px; } .login h1 { text-align: center; font-size: 28px; } .login .muted { text-align: center; }
    .form { display: grid; gap: 14px; } label { display: grid; gap: 6px; color: var(--navy); font-size: 13px; font-weight: 800; } input { width: 100%; padding: 12px 13px; border: 1px solid var(--line); border-radius: 5px; font: inherit; } input:focus { outline: 3px solid rgba(0,140,149,.15); border-color: var(--teal); } .form .btn { width: 100%; margin-top: 5px; }
    .message { min-height: 20px; margin: 12px 0 0; color: #ad3e29; font-size: 13px; } .message.success { color: #177245; }
    #profileView { display: none; } .profile-grid { display: grid; grid-template-columns: 220px 1fr; gap: 26px; padding: 26px; } .profile-photo { width: 180px; height: 220px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); background: #e8eeee; } .details { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-content: start; } .detail { border-bottom: 1px solid var(--line); padding-bottom: 10px; } .detail b { display: block; color: var(--muted); font-size: 11px; letter-spacing: .6px; text-transform: uppercase; margin-bottom: 4px; } .detail span { font-size: 16px; font-weight: 800; }
    .password-panel { margin-top: 20px; padding: 24px; } .password-panel form { max-width: 460px; } .top-actions { display: flex; gap: 8px; align-items: center; }
    @media (max-width: 650px) { .shell { width: min(100% - 20px, 980px); padding-top: 12px; } .topbar { align-items: flex-start; flex-direction: column; } .top-actions { width: 100%; } .top-actions .btn { flex: 1; text-align: center; } .profile-grid { grid-template-columns: 1fr; padding: 20px; } .profile-photo { width: 150px; height: 185px; } .details { grid-template-columns: 1fr; } .login { margin-top: 5vh; padding: 24px; } }
  </style>
</head>
<body>
  <main class="shell">
    <section class="panel login" id="loginView">
      <img class="login-logo" src="muesa bg.png" alt="MUESA crest">
      <h1>Student Portal</h1>
      <p class="muted">Sign in with your registration number and password.</p>
      <form class="form" id="loginForm">
        <label>Registration / Student Number<input id="loginRegNo" required autocomplete="username"></label>
        <label>Password<input id="loginPassword" type="password" required autocomplete="current-password" value="123"></label>
        <button class="btn btn-primary" type="submit">Sign in</button>
      </form>
      <p class="message" id="loginMessage" role="alert"></p>
    </section>

    <section id="profileView">
      <header class="topbar">
        <div class="brand"><img src="muesa bg.png" alt="MUESA crest"><div><div class="eyebrow">MUESA student portal</div><h2>My student profile</h2></div></div>
        <div class="top-actions"><a class="btn btn-quiet" href="index.html">Main portal</a><button class="btn btn-primary" id="logoutBtn">Sign out</button></div>
      </header>
      <section class="panel profile-grid">
        <div><img class="profile-photo" id="profilePhoto" alt="Student profile photo"></div>
        <div><h1 id="profileName"></h1><p class="muted">Your registered student information</p><div class="details"><div class="detail"><b>Registration number</b><span id="profileRegNo"></span></div><div class="detail"><b>Class / Semester</b><span id="profileClass"></span></div><div class="detail"><b>Year</b><span id="profileYear"></span></div><div class="detail"><b>Payment type</b><span id="profilePayment"></span></div></div></div>
      </section>
      <section class="panel password-panel"><h2>Change password</h2><p class="muted">Use a password you do not share with anyone else.</p><form class="form" id="passwordForm"><label>Current password<input id="currentPassword" type="password" required autocomplete="current-password"></label><label>New password<input id="newPassword" type="password" required minlength="3" autocomplete="new-password"></label><label>Confirm new password<input id="confirmPassword" type="password" required minlength="3" autocomplete="new-password"></label><button class="btn btn-primary" type="submit">Update password</button></form><p class="message" id="passwordMessage" role="alert"></p></section>
    </section>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    let student = null;
    const setMessage = (element, text, success = false) => { element.textContent = text; element.className = `message${success ? ' success' : ''}`; };
    function showProfile(data) {
      student = data;
      $('loginView').style.display = 'none'; $('profileView').style.display = 'block';
      $('profileName').textContent = student.student_name || student.full_name || '-';
      $('profileRegNo').textContent = student.reg_no || '-'; $('profileClass').textContent = student.student_class || '-'; $('profileYear').textContent = student.year || '-'; $('profilePayment').textContent = student.payment_type || '-';
      $('profilePhoto').src = student.photo_data || 'muesa bg.png'; $('profilePhoto').alt = `Photo of ${student.student_name || 'student'}`;
    }
    $('loginForm').addEventListener('submit', async event => {
      event.preventDefault(); setMessage($('loginMessage'), 'Signing in...');
      try {
        const response = await fetch('/api/index', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'student_login', reg_no: $('loginRegNo').value, password: $('loginPassword').value }) });
        const data = await response.json(); if (!response.ok || !data.success) throw new Error(data.error || 'Unable to sign in.');
        showProfile(data.student); $('currentPassword').value = $('loginPassword').value; $('loginForm').reset();
      } catch (error) { setMessage($('loginMessage'), error.message); }
    });
    $('passwordForm').addEventListener('submit', async event => {
      event.preventDefault();
      if ($('newPassword').value !== $('confirmPassword').value) { setMessage($('passwordMessage'), 'New passwords do not match.'); return; }
      try {
        const response = await fetch('/api/index', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'change_password', reg_no: student.reg_no, current_password: $('currentPassword').value, new_password: $('newPassword').value }) });
        const data = await response.json(); if (!response.ok || !data.success) throw new Error(data.error || 'Unable to update password.');
        $('currentPassword').value = $('newPassword').value; $('newPassword').value = ''; $('confirmPassword').value = ''; setMessage($('passwordMessage'), data.message, true);
      } catch (error) { setMessage($('passwordMessage'), error.message); }
    });
    $('logoutBtn').addEventListener('click', () => { student = null; $('profileView').style.display = 'none'; $('loginView').style.display = 'block'; $('loginPassword').value = '123'; setMessage($('loginMessage'), ''); });
  </script>
</body>
</html>
