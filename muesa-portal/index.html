<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MUESA Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <div class="container py-5">
    <!-- Login Card -->
    <div id="loginSection" class="row justify-content-center">
      <div class="col-md-5">
        <div class="card shadow-sm border-0">
          <div class="card-body p-4">
            <h3 class="card-title text-center mb-1">MUESA Portal Login</h3>
            <p class="text-muted text-center small mb-4">Mutesa I Royal University Education Students Association</p>
            <form id="loginForm">
              <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" id="username" class="form-control" required value="financial_muesa" />
              </div>
              <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" id="password" class="form-control" required />
              </div>
              <button type="submit" class="btn btn-primary w-100">Sign In</button>
              <div id="loginMsg" class="text-danger text-center mt-3 small"></div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Main Portal Dashboard -->
    <div id="portalSection" class="d-none">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>MUESA Student Payment Records</h2>
        <button id="logoutBtn" class="btn btn-outline-secondary btn-sm">Sign Out</button>
      </div>

      <!-- Registration Form -->
      <div class="card border-0 shadow-sm mb-4">
        <div class="card-body">
          <h5 class="card-title mb-3">Record Student Payment</h5>
          <form id="studentForm">
            <div class="row g-3">
              <div class="col-md-4">
                <input type="text" id="student_name" class="form-control" placeholder="Student Full Name" required />
              </div>
              <div class="col-md-4">
                <input type="text" id="reg_no" class="form-control" placeholder="Reg / Student No" required />
              </div>
              <div class="col-md-4">
                <input type="email" id="student_email" class="form-control" placeholder="Student Email Address" />
              </div>
              <div class="col-md-3">
                <input type="text" id="student_class" class="form-control" placeholder="Class / Program" />
              </div>
              <div class="col-md-3">
                <input type="text" id="year" class="form-control" placeholder="Year / Semester" />
              </div>
              <div class="col-md-3">
                <select id="payment_type" class="form-select" required>
                  <option value="">-- Select Payment Type --</option>
                  <option value="MUESA Subscription Fee">MUESA Subscription Fee</option>
                  <option value="Event / Trip Fee">Event / Trip Fee</option>
                  <option value="T-Shirt Payment">T-Shirt Payment</option>
                  <option value="Other">Other</option>
                </select>
              </div>
              <div class="col-md-3">
                <input type="number" id="amount" class="form-control" placeholder="Amount (UGX)" required />
              </div>
            </div>
            <div class="mt-3 text-end">
              <button type="submit" class="btn btn-success">Save Record & Send Email Receipt</button>
            </div>
          </form>
          <div id="formMsg" class="mt-2 text-center small"></div>
        </div>
      </div>

      <!-- Records Table -->
      <div class="card border-0 shadow-sm">
        <div class="card-body">
          <h5 class="card-title mb-3">Recent Transactions</h5>
          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead class="table-light">
                <tr>
                  <th>#</th>
                  <th>Student Name</th>
                  <th>Reg No</th>
                  <th>Class</th>
                  <th>Payment Type</th>
                  <th>Amount (UGX)</th>
                  <th>Email</th>
                </tr>
              </thead>
              <tbody id="recordsTableBody">
                <tr><td colspan="7" class="text-center text-muted">Loading records...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const studentForm = document.getElementById('studentForm');
    const loginSection = document.getElementById('loginSection');
    const portalSection = document.getElementById('portalSection');
    const loginMsg = document.getElementById('loginMsg');
    const formMsg = document.getElementById('formMsg');

    // Handle Login
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginMsg.textContent = '';
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/index', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'login', username, password })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          loginSection.classList.add('d-none');
          portalSection.classList.remove('d-none');
          loadRecords();
        } else {
          loginMsg.textContent = data.error || 'Login failed.';
        }
      } catch (err) {
        loginMsg.textContent = 'Network or server error.';
      }
    });

    // Handle Student Registration
    studentForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      formMsg.textContent = 'Processing payment and sending email...';
      formMsg.className = 'mt-2 text-center small text-info';

      const payload = {
        student_name: document.getElementById('student_name').value,
        reg_no: document.getElementById('reg_no').value,
        student_email: document.getElementById('student_email').value,
        student_class: document.getElementById('student_class').value,
        year: document.getElementById('year').value,
        payment_type: document.getElementById('payment_type').value,
        amount: document.getElementById('amount').value,
        registered_by: 'Financial Admin'
      };

      try {
        const res = await fetch('/api/index', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (res.ok && data.success) {
          formMsg.textContent = 'Record added & email receipt dispatched successfully!';
          formMsg.className = 'mt-2 text-center small text-success';
          studentForm.reset();
          loadRecords();
        } else {
          formMsg.textContent = data.error || 'Failed to record student.';
          formMsg.className = 'mt-2 text-center small text-danger';
        }
      } catch (err) {
        formMsg.textContent = 'Server processing error.';
        formMsg.className = 'mt-2 text-center small text-danger';
      }
    });

    // Load Records
    async function loadRecords() {
      try {
        const res = await fetch('/api/index');
        const data = await res.json();
        const tbody = document.getElementById('recordsTableBody');
        tbody.innerHTML = '';
        if (Array.isArray(data) && data.length > 0) {
          data.forEach((item, index) => {
            tbody.innerHTML += `
              <tr>
                <td>${index + 1}</td>
                <td><strong>${item.student_name}</strong></td>
                <td>${item.reg_no}</td>
                <td>${item.student_class || '-'}</td>
                <td>${item.payment_type || '-'}</td>
                <td class="text-success font-monospace">UGX ${Number(item.amount).toLocaleString()}</td>
                <td><small class="text-muted">${item.student_email || 'None'}</small></td>
              </tr>
            `;
          });
        } else {
          tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted">No records found.</td></tr>';
        }
      } catch (err) {
        console.error(err);
      }
    }

    // Sign Out
    document.getElementById('logoutBtn').addEventListener('click', () => {
      portalSection.classList.add('d-none');
      loginSection.classList.remove('d-none');
    });
  </script>
</body>
</html>
