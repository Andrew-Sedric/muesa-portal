<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUESA Portal</title>
  <style>
    :root {
      --muesa-blue: #0756a4;
      --muesa-blue-dark: #06366d;
      --muesa-yellow: #f5cf00;
      --muesa-red: #c9282d;
      --ink: #172033;
      --muted: #607087;
      --surface: rgba(255, 255, 255, 0.96);
      --line: #dfe6ef;
      --shadow: 0 18px 45px rgba(10, 38, 73, 0.12);
    }

    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      background: #e8eef5 url('muesa%20bg.png') center / 520px auto fixed no-repeat;
      margin: 0; padding: 32px 20px; color: var(--ink); min-height: 100vh;
      position: relative;
    }
    body::before {
      content: ''; position: fixed; inset: 0; z-index: -1;
      background: linear-gradient(135deg, rgba(242, 247, 252, 0.95), rgba(216, 229, 243, 0.88));
    }
    .container { max-width: 1120px; margin: 0 auto; }

    /* Login Modal */
    #loginOverlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(135deg, rgba(6, 54, 109, 0.88), rgba(7, 86, 164, 0.78));
      display: flex; align-items: center; justify-content: center; z-index: 1000;
      padding: 20px;
    }
    .login-card {
      background: var(--surface) url('muesa%20bg.png') center 28px / 112px auto no-repeat;
      padding: 175px 34px 34px; border-radius: 18px; width: 100%; max-width: 420px;
      box-shadow: 0 24px 80px rgba(2, 20, 46, 0.3); border-top: 6px solid var(--muesa-yellow);
    }
    .login-card h2 { margin: 0 0 24px; color: var(--muesa-blue-dark); text-align: center; font-size: 24px; }

    /* Header & Cards */
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 26px; padding: 20px 24px; background: rgba(255,255,255,0.92); border-left: 7px solid var(--muesa-blue); border-radius: 12px; box-shadow: var(--shadow); }
    .header h2 { margin: 0; color: var(--muesa-blue-dark); font-size: 25px; letter-spacing: 0; }
    #userBadge { color: var(--muesa-blue-dark); }
    .card { background: var(--surface); padding: 30px; border-radius: 14px; box-shadow: var(--shadow); margin-bottom: 26px; border: 1px solid rgba(255,255,255,0.8); }
    .card h3 { margin-top: 0; color: var(--muesa-blue-dark); border-bottom: 2px solid var(--line); padding-bottom: 13px; }

    /* Form Grid */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 19px 22px; }
    .form-group { display: flex; flex-direction: column; }
    .form-group.full-width { grid-column: span 2; }
    label { font-size: 12px; font-weight: 700; margin-bottom: 7px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    input, select { padding: 12px 13px; border: 1px solid #cbd6e3; border-radius: 7px; font-size: 14px; width: 100%; background: #fbfdff; color: var(--ink); transition: border-color 0.2s, box-shadow 0.2s; }
    input:focus, select:focus { outline: none; border-color: var(--muesa-blue); box-shadow: 0 0 0 3px rgba(7, 86, 164, 0.14); }

    /* Buttons */
    .btn-submit {
      background: var(--muesa-blue); color: white; border: none; padding: 13px 16px;
      font-size: 15px; font-weight: bold; border-radius: 7px; cursor: pointer; margin-top: 20px; width: 100%; transition: background 0.2s, transform 0.2s;
    }
    .btn-submit:hover { background: var(--muesa-blue-dark); transform: translateY(-1px); }
    .btn-logout { background: #fff; color: var(--muesa-blue-dark); border: 1px solid #c6d2df; padding: 9px 16px; border-radius: 7px; cursor: pointer; font-weight: 700; }

    .btn-action {
      background-color: var(--muesa-blue); color: white; border: none; padding: 10px 15px;
      border-radius: 7px; cursor: pointer; font-weight: bold; font-size: 13px;
    }
    .btn-action:hover { background-color: var(--muesa-blue-dark); }

    .btn-delete {
      background-color: var(--muesa-red); color: white; border: none; padding: 6px 9px;
      border-radius: 5px; cursor: pointer; font-size: 12px; font-weight: 700;
    }
    .btn-delete:hover { background-color: #991f24; }

    /* Calculator */
    .calc-box {
      background: #fff9d9; border: 1px solid #ead36a; padding: 17px 19px; border-radius: 9px;
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;
    }
    .calc-box h4 { margin: 0; font-size: 14px; color: #695800; }
    .calc-box span { font-size: 18px; font-weight: bold; color: var(--muesa-blue-dark); }

    table { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 15px; overflow: hidden; border: 1px solid var(--line); border-radius: 9px; }
    th, td { border-bottom: 1px solid var(--line); padding: 12px 10px; text-align: left; font-size: 13px; }
    th { background-color: var(--muesa-blue-dark); color: white; font-weight: 700; }
    tr:last-child td { border-bottom: none; }
    tbody tr:nth-child(even) { background: #f7faff; }
    tbody tr:hover { background: #fffbe8; }

    @media (max-width: 700px) {
      body { padding: 16px 12px; background-size: 380px auto; }
      .header { align-items: flex-start; flex-direction: column; gap: 15px; padding: 18px; }
      .header h2 { font-size: 21px; }
      .card { padding: 20px 16px; }
      .form-grid { grid-template-columns: 1fr; gap: 16px; }
      .form-group.full-width { grid-column: span 1; }
      .calc-box { align-items: flex-start; flex-direction: column; gap: 8px; }
      #printableTableArea { overflow-x: auto; }
      table { min-width: 820px; }
    }

    /* Print Formatting */
    @media print {
      body * { visibility: hidden; }
      #printableTableArea, #printableTableArea * { visibility: visible; }
      #printableTableArea { position: absolute; left: 0; top: 0; width: 100%; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body>

  <!-- LOGIN MODAL -->
  <div id="loginOverlay">
    <div class="login-card">
      <h2>MUESA Portal Login</h2>
      <form id="loginForm">
        <div class="form-group" style="margin-bottom: 15px;">
          <label>Username</label>
          <input type="text" id="login_user" required>
        </div>
        <div class="form-group" style="margin-bottom: 15px;">
          <label>Password</label>
          <input type="password" id="login_pass" required>
        </div>
        <button type="submit" class="btn-submit">Sign In</button>
      </form>
    </div>
  </div>

  <!-- MAIN APP PORTAL -->
  <div class="container" id="appContent" style="display: none;">
    
    <div class="header">
      <h2>MUESA Student Payment Records</h2>
      <div>
        <span id="userBadge" style="margin-right: 15px; font-weight: bold;"></span>
        <button class="btn-logout" id="logoutBtn">Sign Out</button>
      </div>
    </div>

    <!-- STUDENT PAYMENT FORM -->
    <div class="card">
      <h3>Record Student Payment</h3>
      <form id="studentForm">
        <div class="form-grid">
          
          <div class="form-group">
            <label>Student Name</label>
            <input type="text" id="student_name" placeholder="Full Name" required>
          </div>

          <div class="form-group">
            <label>Reg / Student No</label>
            <input type="text" id="reg_no" placeholder="e.g. MRU2026003244" required>
          </div>

          <div class="form-group">
            <label>Class / Semester</label>
            <select id="student_class" required>
              <option value="1 sem">1 sem</option>
              <option value="2 sem">2 sem</option>
            </select>
          </div>

          <div class="form-group">
            <label>Year</label>
            <select id="year" required>
              <option value="Year 1">Year 1</option>
              <option value="Year 2">Year 2</option>
              <option value="Year 3">Year 3</option>
            </select>
          </div>

          <div class="form-group">
            <label>Email Address (for receipt)</label>
            <input type="email" id="email" placeholder="student@gmail.com">
          </div>

          <div class="form-group">
            <label>Phone Number</label>
            <input type="text" id="phone" placeholder="0700000000">
          </div>

          <div class="form-group">
            <label>Payment Type</label>
            <select id="payment_type" onchange="toggleCustomNoteField()" required>
              <option value="Subscription">Subscription</option>
              <option value="Renew">Renew</option>
              <option value="Others">Others</option>
            </select>
          </div>

          <div class="form-group">
            <label>Amount Paid (UGX)</label>
            <input type="number" id="amount" placeholder="e.g. 20000" required>
          </div>

          <!-- DYNAMIC CUSTOM NOTE FIELD -->
          <div class="form-group full-width" id="customNoteGroup" style="display: none;">
            <label style="color: #004d26;">Custom Payment Details / Note</label>
            <input type="text" id="custom_payment_note" placeholder="Specify details for 'Others' (e.g. T-Shirt, Trip Fee, Fine)">
          </div>

        </div>
        <button type="submit" class="btn-submit">Submit Registration & Record Payment</button>
      </form>
    </div>

    <!-- ADMIN-ONLY: RECORDS & FINANCIAL REPORTS -->
    <div class="card" id="reportsSection" style="display: none;">
      <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eef2f5; padding-bottom: 10px; margin-bottom: 15px;">
        <h3 style="margin: 0; border: none; padding: 0;">Records & Financial Reports</h3>
        <button class="btn-action" onclick="printSelectedRecords()">🖨️ Print Selected / Visible Records</button>
      </div>

      <!-- CALCULATOR BOX -->
      <div class="calc-box">
        <h4>Custom Sum Calculator (Selected Items: <span id="selectedCount">0</span>)</h4>
        <div>Total Sum: <span id="calculatedSum">UGX 0</span></div>
      </div>

      <div class="form-grid" style="margin-bottom: 15px;">
        <div class="form-group">
          <label>Filter Year</label>
          <select id="filterYear" onchange="filterRecords()">
            <option value="All">All Years</option>
            <option value="Year 1">Year 1</option>
            <option value="Year 2">Year 2</option>
            <option value="Year 3">Year 3</option>
          </select>
        </div>
        <div class="form-group">
          <label>Filter Payment</label>
          <select id="filterType" onchange="filterRecords()">
            <option value="All">All Types</option>
            <option value="Subscription">Subscription</option>
            <option value="Renew">Renew</option>
            <option value="Others">Others</option>
          </select>
        </div>
      </div>

      <div id="printableTableArea">
        <table>
          <thead>
            <tr>
              <th class="no-print" style="width: 30px;"><input type="checkbox" id="selectAll" onchange="toggleSelectAll(this)"></th>
              <th>Name</th>
              <th>Reg No</th>
              <th>Sem</th>
              <th>Year</th>
              <th>Type</th>
              <th>Amount (UGX)</th>
              <th>Registered By</th>
              <th class="no-print" style="width: 60px;">Action</th>
            </tr>
          </thead>
          <tbody id="recordsTableBody">
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    let currentUser = null;
    let currentRole = null;
    let allRecords = [];

    // TOGGLE CUSTOM NOTE INPUT FIELD
    function toggleCustomNoteField() {
      const type = document.getElementById('payment_type').value;
      const noteGroup = document.getElementById('customNoteGroup');
      const noteInput = document.getElementById('custom_payment_note');

      if (type === 'Others') {
        noteGroup.style.display = 'flex';
        noteInput.required = true;
      } else {
        noteGroup.style.display = 'none';
        noteInput.required = false;
        noteInput.value = '';
      }
    }

    // LOGIN
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('login_user').value;
      const password = document.getElementById('login_pass').value;

      try {
        const res = await fetch('/api/index', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'login', username, password })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          currentUser = data.user;
          currentRole = data.role;

          document.getElementById('loginOverlay').style.display = 'none';
          document.getElementById('appContent').style.display = 'block';
          document.getElementById('userBadge').innerText = `Logged in as: ${currentUser} (${currentRole.toUpperCase()})`;

          if (currentRole === 'admin') {
            document.getElementById('reportsSection').style.display = 'block';
            loadRecords();
          } else {
            document.getElementById('reportsSection').style.display = 'none';
          }
        } else {
          alert(data.error || 'Login failed.');
        }
      } catch (err) {
        alert('Connection error.');
      }
    });

    // LOGOUT
    document.getElementById('logoutBtn').addEventListener('click', () => {
      location.reload();
    });

    // SUBMIT RECORD
    document.getElementById('studentForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const payload = {
        student_name: document.getElementById('student_name').value,
        reg_no: document.getElementById('reg_no').value,
        student_class: document.getElementById('student_class').value,
        year: document.getElementById('year').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        payment_type: document.getElementById('payment_type').value,
        custom_payment_note: document.getElementById('custom_payment_note').value,
        amount: document.getElementById('amount').value,
        registered_by: currentUser
      };

      try {
        const res = await fetch('/api/index', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (res.ok && data.success) {
          if (data.emailSent) {
            alert('Record saved & official email receipt sent successfully!');
          } else if (data.emailError) {
            alert('Record saved in database, BUT Email failed: ' + data.emailError);
          } else {
            alert('Record saved in database (No email address provided).');
          }
          document.getElementById('studentForm').reset();
          toggleCustomNoteField();
          if (currentRole === 'admin') loadRecords();
        } else {
          alert('Error: ' + (data.error || 'Failed to submit'));
        }
      } catch (err) {
        alert('Connection error.');
      }
    });

    // FETCH RECORDS
    async function loadRecords() {
      try {
        const res = await fetch('/api/index');
        allRecords = await res.json();
        filterRecords();
      } catch (err) {
        console.error('Error loading records:', err);
      }
    }

    // FILTER & RENDER TABLE
    function filterRecords() {
      const yearVal = document.getElementById('filterYear').value;
      const typeVal = document.getElementById('filterType').value;

      const filtered = allRecords.filter(r => {
        const matchYear = yearVal === 'All' || r.year === yearVal;
        const matchType = typeVal === 'All' || (r.payment_type && r.payment_type.startsWith(typeVal));
        return matchYear && matchType;
      });

      const tbody = document.getElementById('recordsTableBody');
      tbody.innerHTML = '';

      filtered.forEach(r => {
        const row = `
          <tr>
            <td class="no-print"><input type="checkbox" class="record-checkbox" data-amount="${r.amount || 0}" onchange="calculateSelectedSum()"></td>
            <td>${r.student_name || r.full_name || '-'}</td>
            <td>${r.reg_no || '-'}</td>
            <td>${r.student_class || '-'}</td>
            <td>${r.year || '-'}</td>
            <td>${r.payment_type || '-'}</td>
            <td>UGX ${Number(r.amount || 0).toLocaleString()}</td>
            <td>${r.registered_by || 'Admin'}</td>
            <td class="no-print"><button class="btn-delete" onclick="deleteRecord(${r.id})">Delete</button></td>
          </tr>
        `;
        tbody.innerHTML += row;
      });

      document.getElementById('selectAll').checked = false;
      calculateSelectedSum();
    }

    // CALCULATE SELECTED SUM
    function calculateSelectedSum() {
      const checkboxes = document.querySelectorAll('.record-checkbox:checked');
      let sum = 0;
      checkboxes.forEach(cb => {
        sum += Number(cb.getAttribute('data-amount') || 0);
      });
      document.getElementById('selectedCount').innerText = checkboxes.length;
      document.getElementById('calculatedSum').innerText = `UGX ${sum.toLocaleString()}`;
    }

    // TOGGLE SELECT ALL
    function toggleSelectAll(masterCb) {
      const checkboxes = document.querySelectorAll('.record-checkbox');
      checkboxes.forEach(cb => cb.checked = masterCb.checked);
      calculateSelectedSum();
    }

    // DELETE RECORD
    async function deleteRecord(id) {
      if (!confirm('Are you sure you want to permanently delete this record?')) return;
      try {
        const res = await fetch(`/api/index?id=${id}`, { method: 'DELETE' });
        const data = await res.json();
        if (res.ok && data.success) {
          alert('Record deleted successfully.');
          loadRecords();
        } else {
          alert('Failed to delete record: ' + (data.error || 'Unknown error'));
        }
      } catch (err) {
        alert('Error communicating with server.');
      }
    }

    // PRINT RECORDS
    function printSelectedRecords() {
      const checkboxes = document.querySelectorAll('.record-checkbox');
      const hasSelection = Array.from(checkboxes).some(cb => cb.checked);

      if (hasSelection) {
        checkboxes.forEach(cb => {
          const tr = cb.closest('tr');
          if (!cb.checked) {
            tr.classList.add('no-print');
          } else {
            tr.classList.remove('no-print');
          }
        });
      } else {
        checkboxes.forEach(cb => {
          cb.closest('tr').classList.remove('no-print');
        });
      }

      window.print();
    }
  </script>
</body>
</html>
