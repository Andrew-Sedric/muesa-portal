<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MUESA Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    .btn-muesa { background-color: #0f6838; color: #fff; }
    .btn-muesa:hover { background-color: #0b4d29; color: #fff; }
    .badge-sub { background-color: #198754; color: #fff; padding: 6px 12px; border-radius: 4px; }
  </style>
</head>
<body class="bg-light">
  <div class="container py-4">

    <!-- LOGIN FORM -->
    <div id="loginSection" class="row justify-content-center py-5">
      <div class="col-md-5">
        <div class="card border-0 shadow-sm">
          <div class="card-body p-4">
            <h3 class="text-center fw-bold mb-1">MUESA Portal Login</h3>
            <p class="text-center text-muted small mb-4">Mutesa I Royal University Education Students Association</p>
            <form id="loginForm">
              <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" id="username" class="form-control" placeholder="e.g. president_muesa" required />
              </div>
              <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" id="password" class="form-control" required />
              </div>
              <button type="submit" class="btn btn-primary w-100">Sign In</button>
              <div id="loginMsg" class="text-danger text-center mt-3 small"></div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="portalSection" class="d-none">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="fw-bold">MUESA Student Payment Records</h3>
        <button id="logoutBtn" class="btn btn-outline-secondary btn-sm">Sign Out</button>
      </div>

      <!-- ENTRY FORM -->
      <div class="card border-0 shadow-sm mb-4">
        <div class="card-body">
          <h5 class="fw-bold mb-3">Record Student Payment</h5>
          <form id="studentForm">
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label small text-muted">Student Name</label>
                <input type="text" id="student_name" class="form-control" placeholder="Full Name" required />
              </div>
              <div class="col-md-6">
                <label class="form-label small text-muted">Reg / Student No</label>
                <input type="text" id="reg_no" class="form-control" placeholder="e.g. MRU2026003244" required />
              </div>
              <div class="col-md-6">
                <label class="form-label small text-muted">Class / Semester</label>
                <input type="text" id="student_class" class="form-control" placeholder="Year 1 Semester 1" />
              </div>
              <div class="col-md-6">
                <label class="form-label small text-muted">Year</label>
                <input type="text" id="year" class="form-control" placeholder="Year 1" />
              </div>
              <div class="col-md-6">
                <label class="form-label small text-muted">Email Address (for receipt)</label>
                <input type="email" id="email" class="form-control" placeholder="student@gmail.com" />
              </div>
              <div class="col-md-6">
                <label class="form-label small text-muted">Phone Number</label>
                <input type="text" id="phone" class="form-control" placeholder="0700000000" />
              </div>
              <div class="col-md-6">
                <label class="form-label small text-muted">Payment Type</label>
                <select id="payment_type" class="form-select">
                  <option value="Subscription">Subscription</option>
                  <option value="Event / Trip Fee">Event / Trip Fee</option>
                  <option value="T-Shirt Payment">T-Shirt Payment</option>
                  <option value="Other">Other</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label small text-muted">Amount Paid (UGX)</label>
                <input type="number" id="amount" class="form-control" placeholder="e.g. 20000" required />
              </div>
            </div>
            <button type="submit" class="btn btn-muesa w-100 py-2 fw-semibold">Submit Registration & Record Payment</button>
          </form>
        </div>
      </div>

      <!-- RECORDS & FINANCIAL REPORTS -->
      <div class="card border-0 shadow-sm">
        <div class="card-body">
          <h5 class="fw-bold mb-3">Records & Financial Reports</h5>
          
          <!-- FILTERS -->
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label small text-muted">Filter Year</label>
              <select id="filterYear" class="form-select">
                <option value="ALL">All Years</option>
                <option value="Year 1">Year 1</option>
                <option value="Year 2">Year 2</option>
                <option value="Year 3">Year 3</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label small text-muted">Filter Payment</label>
              <select id="filterType" class="form-select">
                <option value="ALL">All Types</option>
                <option value="Subscription">Subscription</option>
                <option value="Event / Trip Fee">Event / Trip Fee</option>
                <option value="T-Shirt Payment">T-Shirt Payment</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label small text-muted">Start Date</label>
              <input type="date" id="startDate" class="form-control" />
            </div>
            <div class="col-md-6">
              <label class="form-label small text-muted">End Date</label>
              <input type="date" id="endDate" class="form-control" />
            </div>
          </div>

          <button onclick="window.print()" class="btn btn-secondary w-100 mb-3">Print / Save Report PDF</button>

          <!-- RECORDS TABLE -->
          <div class="table-responsive">
            <table class="table align-middle">
              <thead class="table-light">
                <tr>
                  <th>Date</th>
                  <th>Student Name</th>
                  <th>Reg / Student No</th>
                  <th>Class</th>
                  <th>Type</th>
                  <th>Amount (UGX)</th>
                  <th>Registered By</th>
                </tr>
              </thead>
              <tbody id="recordsTableBody">
                <tr><td colspan="7" class="text-center text-muted">Loading transactions...</td></tr>
              </tbody>
            </table>
          </div>

          <div class="text-end mt-3">
            <h5 class="fw-bold">Total Revenue: UGX <span id="totalRevenue">0</span></h5>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script>
    let allRecords = [];
    let currentUser = 'President (president_muesa)';

    // LOGIN
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/index', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'login', username, password })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          currentUser = data.user || username;
          document.getElementById('loginSection').classList.add('d-none');
          document.getElementById('portalSection').classList.remove('d-none');
          loadRecords();
        } else {
          alert(data.error || 'Invalid credentials');
        }
      } catch (err) {
        alert('Login failed. Please check network.');
      }
    });

    // SUBMIT RECORD
    document.getElementById('studentForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const payload = {
        student_name: document.getElementById('student_name').value,
        reg_no: document.getElementById('reg_no').value,
        student_class: document.getElementById('student_class').value,
        year: document.getElementById('year').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        payment_type: document.getElementById('payment_type').value,
        amount: document.getElementById('amount').value,
        registered_by: currentUser
      };

      try {
        const res = await fetch('/api/index', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (res.ok && data.success) {
          alert('Record saved & email receipt sent!');
          document.getElementById('studentForm').reset();
          loadRecords();
        } else {
          alert('Error: ' + (data.error || 'Failed to submit'));
        }
      } catch (err) {
        alert('Connection error.');
      }
    });

    // LOAD RECORDS & RENDER
    async function loadRecords() {
      try {
        const res = await fetch('/api/index');
        allRecords = await res.json();
        renderTable(allRecords);
      } catch (err) {
        console.error(err);
      }
    }

    function renderTable(data) {
      const tbody = document.getElementById('recordsTableBody');
      tbody.innerHTML = '';
      let total = 0;

      if (Array.isArray(data) && data.length > 0) {
        data.forEach(item => {
          const name = item.student_name || item.name || 'N/A';
          const reg = item.reg_no || item.regNo || '-';
          const cls = item.student_class || item.class || '-';
          const pType = item.payment_type || item.paymentType || 'Subscription';
          const amt = Number(item.amount || 0);
          const regBy = item.registered_by || 'Admin';
          const date = item.created_at ? new Date(item.created_at).toLocaleDateString() : new Date().toLocaleDateString();

          total += amt;

          tbody.innerHTML += `
            <tr>
              <td>${date}</td>
              <td><strong>${name}</strong></td>
              <td>${reg}</td>
              <td>${cls}</td>
              <td><span class="badge-sub">${pType}</span></td>
              <td>${amt.toLocaleString()}</td>
              <td><small class="text-muted">${regBy}</small></td>
            </tr>
          `;
        });
      } else {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted">No records found.</td></tr>';
      }

      document.getElementById('totalRevenue').textContent = total.toLocaleString();
    }

    // SIGN OUT
    document.getElementById('logoutBtn').addEventListener('click', () => {
      document.getElementById('portalSection').classList.add('d-none');
      document.getElementById('loginSection').classList.remove('d-none');
    });
  </script>
</body>
</html>
