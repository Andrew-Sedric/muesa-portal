<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUESA Portal</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f8; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 1000px; margin: 0 auto; }
    
    /* Login Modal */
    #loginOverlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 1000;
    }
    .login-card {
      background: white; padding: 30px; border-radius: 8px; width: 100%; max-width: 400px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .login-card h2 { margin-top: 0; color: #004d26; text-align: center; }

    /* Header & Cards */
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 25px; }
    .card h3 { margin-top: 0; color: #004d26; border-bottom: 2px solid #eef2f5; padding-bottom: 10px; }
    
    /* Form Grid */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .form-group { display: flex; flex-direction: column; }
    .form-group.full-width { grid-column: span 2; }
    label { font-size: 13px; font-weight: 600; margin-bottom: 5px; color: #555; }
    input, select { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; width: 100%; }
    
    /* Buttons */
    .btn-submit {
      background-color: #004d26; color: white; border: none; padding: 12px;
      font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 15px; width: 100%;
    }
    .btn-submit:hover { background-color: #003319; }
    .btn-logout { background: #fff; border: 1px solid #ccc; padding: 6px 15px; border-radius: 4px; cursor: pointer; }

    /* Table & Stats */
    .stats-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 15px; }
    .stat-card { background: #e8f5e9; padding: 15px; border-radius: 6px; text-align: center; }
    .stat-card h4 { margin: 0; font-size: 12px; color: #2e7d32; text-transform: uppercase; }
    .stat-card p { margin: 5px 0 0 0; font-size: 20px; font-weight: bold; color: #1b5e20; }

    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #eee; padding: 10px; text-align: left; font-size: 13px; }
    th { background-color: #f8f9fa; font-weight: 600; }
  </style>
</head>
<body>

  <!-- LOGIN MODAL -->
  <div id="loginOverlay">
    <div class="login-card">
      <h2>MUESA Portal Login</h2>
      <form id="loginForm">
        <div class="form-group" style="margin-bottom: 15px;">
          <label>Username</label>
          <input type="text" id="login_user" required>
        </div>
        <div class="form-group" style="margin-bottom: 15px;">
          <label>Password</label>
          <input type="password" id="login_pass" required>
        </div>
        <button type="submit" class="btn-submit">Sign In</button>
      </form>
    </div>
  </div>

  <!-- MAIN APP PORTAL -->
  <div class="container" id="appContent" style="display: none;">
    
    <div class="header">
      <h2>MUESA Student Payment Records</h2>
      <div>
        <span id="userBadge" style="margin-right: 15px; font-weight: bold;"></span>
        <button class="btn-logout" id="logoutBtn">Sign Out</button>
      </div>
    </div>

    <!-- STUDENT PAYMENT FORM -->
    <div class="card">
      <h3>Record Student Payment</h3>
      <form id="studentForm">
        <div class="form-grid">
          
          <div class="form-group">
            <label>Student Name</label>
            <input type="text" id="student_name" placeholder="Full Name" required>
          </div>

          <div class="form-group">
            <label>Reg / Student No</label>
            <input type="text" id="reg_no" placeholder="e.g. MRU2026003244" required>
          </div>

          <div class="form-group">
            <label>Class / Semester</label>
            <select id="student_class" required>
              <option value="1 sem">1 sem</option>
              <option value="2 sem">2 sem</option>
            </select>
          </div>

          <div class="form-group">
            <label>Year</label>
            <select id="year" required>
              <option value="Year 1">Year 1</option>
              <option value="Year 2">Year 2</option>
              <option value="Year 3">Year 3</option>
            </select>
          </div>

          <div class="form-group">
            <label>Email Address (for receipt)</label>
            <input type="email" id="email" placeholder="student@gmail.com">
          </div>

          <div class="form-group">
            <label>Phone Number</label>
            <input type="text" id="phone" placeholder="0700000000">
          </div>

          <div class="form-group">
            <label>Payment Type</label>
            <select id="payment_type" required>
              <option value="Subscription">Subscription</option>
              <option value="Renew">Renew</option>
            </select>
          </div>

          <div class="form-group">
            <label>Amount Paid (UGX)</label>
            <input type="number" id="amount" placeholder="e.g. 20000" required>
          </div>

        </div>
        <button type="submit" class="btn-submit">Submit Registration & Record Payment</button>
      </form>
    </div>

    <!-- ADMIN-ONLY: RECORDS & FINANCIAL REPORTS -->
    <div class="card" id="reportsSection" style="display: none;">
      <h3>Records & Financial Reports</h3>
      
      <div class="stats-bar">
        <div class="stat-card">
          <h4>Total Registrations</h4>
          <p id="totalCount">0</p>
        </div>
        <div class="stat-card">
          <h4>Total Revenue</h4>
          <p id="totalRevenue">UGX 0</p>
        </div>
        <div class="stat-card">
          <h4>Active Filters</h4>
          <p id="filterStatus">All</p>
        </div>
      </div>

      <div class="form-grid" style="margin-bottom: 15px;">
        <div class="form-group">
          <label>Filter Year</label>
          <select id="filterYear" onchange="filterRecords()">
            <option value="All">All Years</option>
            <option value="Year 1">Year 1</option>
            <option value="Year 2">Year 2</option>
            <option value="Year 3">Year 3</option>
          </select>
        </div>
        <div class="form-group">
          <label>Filter Payment</label>
          <select id="filterType" onchange="filterRecords()">
            <option value="All">All Types</option>
            <option value="Subscription">Subscription</option>
            <option value="Renew">Renew</option>
          </select>
        </div>
      </div>

      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Reg No</th>
            <th>Sem</th>
            <th>Year</th>
            <th>Type</th>
            <th>Amount (UGX)</th>
            <th>Registered By</th>
          </tr>
        </thead>
        <tbody id="recordsTableBody">
        </tbody>
      </table>
    </div>

  </div>

  <script>
    let currentUser = null;
    let currentRole = null;
    let allRecords = [];

    // LOGIN DISPATCH
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('login_user').value;
      const password = document.getElementById('login_pass').value;

      try {
        const res = await fetch('/api/index', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'login', username, password })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          currentUser = data.user;
          currentRole = data.role;

          document.getElementById('loginOverlay').style.display = 'none';
          document.getElementById('appContent').style.display = 'block';
          document.getElementById('userBadge').innerText = `Logged in as: ${currentUser} (${currentRole.toUpperCase()})`;

          if (currentRole === 'admin') {
            document.getElementById('reportsSection').style.display = 'block';
            loadRecords();
          } else {
            document.getElementById('reportsSection').style.display = 'none';
          }
        } else {
          alert(data.error || 'Login failed.');
        }
      } catch (err) {
        alert('Connection error.');
      }
    });

    // LOGOUT
    document.getElementById('logoutBtn').addEventListener('click', () => {
      location.reload();
    });

    // SUBMIT RECORD
    document.getElementById('studentForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const payload = {
        student_name: document.getElementById('student_name').value,
        reg_no: document.getElementById('reg_no').value,
        student_class: document.getElementById('student_class').value,
        year: document.getElementById('year').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        payment_type: document.getElementById('payment_type').value,
        amount: document.getElementById('amount').value,
        registered_by: currentUser
      };

      try {
        const res = await fetch('/api/index', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (res.ok && data.success) {
          if (data.emailSent) {
            alert('Record saved & official email receipt sent successfully!');
          } else if (data.emailError) {
            alert('Record saved in database, BUT Email failed: ' + data.emailError);
          } else {
            alert('Record saved in database (No email address provided).');
          }
          document.getElementById('studentForm').reset();
          if (currentRole === 'admin') loadRecords();
        } else {
          alert('Error: ' + (data.error || 'Failed to submit'));
        }
      } catch (err) {
        alert('Connection error.');
      }
    });

    // FETCH RECORDS (ADMIN ONLY)
    async function loadRecords() {
      try {
        const res = await fetch('/api/index');
        allRecords = await res.json();
        filterRecords();
      } catch (err) {
        console.error('Error loading records:', err);
      }
    }

    // FILTER & RENDER TABLE
    function filterRecords() {
      const yearVal = document.getElementById('filterYear').value;
      const typeVal = document.getElementById('filterType').value;

      const filtered = allRecords.filter(r => {
        const matchYear = yearVal === 'All' || r.year === yearVal;
        const matchType = typeVal === 'All' || r.payment_type === typeVal;
        return matchYear && matchType;
      });

      const tbody = document.getElementById('recordsTableBody');
      tbody.innerHTML = '';
      let sum = 0;

      filtered.forEach(r => {
        sum += Number(r.amount || 0);
        const row = `
          <tr>
            <td>${r.student_name || r.full_name || '-'}</td>
            <td>${r.reg_no || '-'}</td>
            <td>${r.student_class || '-'}</td>
            <td>${r.year || '-'}</td>
            <td>${r.payment_type || '-'}</td>
            <td>UGX ${Number(r.amount || 0).toLocaleString()}</td>
            <td>${r.registered_by || 'Admin'}</td>
          </tr>
        `;
        tbody.innerHTML += row;
      });

      document.getElementById('totalCount').innerText = filtered.length;
      document.getElementById('totalRevenue').innerText = `UGX ${sum.toLocaleString()}`;
    }
  </script>
</body>
</html>
