<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUESA Portal</title>
  <style>
    :root { --primary: #0d6efd; --dark: #212529; --light: #f8f9fa; --success: #198754; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #eef2f5; margin: 0; padding: 12px; }
    .card { background: white; border-radius: 10px; padding: 18px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    h2, h3 { margin-top: 0; color: var(--dark); }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; color: #495057; }
    input, select, button { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ced4da; box-sizing: border-box; font-size: 0.95rem; }
    button { background: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; }
    button:active { opacity: 0.85; }
    .hidden { display: none; }
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; color: white; font-weight: bold; }
    .bg-sub { background: #198754; }
    .bg-renew { background: #fd7e14; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85rem; }
    th, td { border: 1px solid #dee2e6; padding: 8px; text-align: left; }
    th { background: #f1f3f5; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    @media print {
      body { background: white; padding: 0; }
      .no-print { display: none !important; }
      .card { box-shadow: none; border: none; padding: 0; }
    }
  </style>
</head>
<body>

  <!-- LOGIN SECTION -->
  <div id="loginSection" class="card">
    <h2 style="text-align:center;">MUESA Portal Login</h2>
    <p style="text-align:center; color:#6c757d; font-size:0.85rem;">Mutesa I Royal University Education Students Association</p>
    <form id="loginForm">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="loginUser" required placeholder="e.g. president_muesa">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPass" required placeholder="Enter password">
      </div>
      <button type="submit">Sign In</button>
    </form>
    <p id="loginError" style="color:red; font-size:0.85rem; text-align:center; margin-top:10px;"></p>
  </div>

  <!-- MAIN APP (Post-Login) -->
  <div id="appSection" class="hidden">
    
    <div class="top-bar no-print">
      <div>
        <strong id="userDisplay">Welcome</strong>
        <br><small id="roleDisplay" style="color:#6c757d;"></small>
      </div>
      <button onclick="logout()" style="width:auto; background:#dc3545; padding:6px 12px; font-size:0.8rem;">Logout</button>
    </div>

    <!-- REGISTRATION FORM -->
    <div class="card no-print">
      <h3>New Member Registration</h3>
      <form id="regForm">
        <div class="form-group"><label>Full Name</label><input type="text" id="fullName" required></div>
        <div style="display:flex; gap:10px;">
          <div class="form-group" style="flex:1;"><label>Student No.</label><input type="text" id="studentNo" required></div>
          <div class="form-group" style="flex:1;"><label>Reg No.</label><input type="text" id="regNo" required></div>
        </div>
        <div style="display:flex; gap:10px;">
          <div class="form-group" style="flex:1;">
            <label>Year of Study</label>
            <select id="yearOfStudy" required>
              <option value="Year 1">Year 1</option>
              <option value="Year 2">Year 2</option>
              <option value="Year 3">Year 3</option>
              <option value="Year 4">Year 4</option>
            </select>
          </div>
          <div class="form-group" style="flex:1;">
            <label>Semester</label>
            <select id="semester" required>
              <option value="Semester 1">Semester 1</option>
              <option value="Semester 2">Semester 2</option>
            </select>
          </div>
        </div>
        <div class="form-group"><label>Email Address (for receipt)</label><input type="email" id="email" required></div>
        <div class="form-group"><label>Phone Number</label><input type="tel" id="phone"></div>
        <div style="display:flex; gap:10px;">
          <div class="form-group" style="flex:1;">
            <label>Payment Type</label>
            <select id="paymentType" required>
              <option value="Subscription">Subscription</option>
              <option value="Renewal">Renewal</option>
            </select>
          </div>
          <div class="form-group" style="flex:1;"><label>Amount Paid (UGX)</label><input type="number" id="amount" required placeholder="e.g. 20000"></div>
        </div>
        <button type="submit" style="background:var(--success);">Submit Registration & Record Payment</button>
      </form>
    </div>

    <!-- REPORTING & FILTERING SECTION -->
    <div class="card">
      <h3>Records & Financial Reports</h3>
      
      <div class="no-print" style="display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-bottom:10px;">
        <div>
          <label>Filter Year</label>
          <select id="filterYear" onchange="fetchRecords()">
            <option value="">All Years</option>
            <option value="Year 1">Year 1</option>
            <option value="Year 2">Year 2</option>
            <option value="Year 3">Year 3</option>
            <option value="Year 4">Year 4</option>
          </select>
        </div>
        <div>
          <label>Filter Payment</label>
          <select id="filterType" onchange="fetchRecords()">
            <option value="">All Types</option>
            <option value="Subscription">Subscription</option>
            <option value="Renewal">Renewal</option>
          </select>
        </div>
        <div><label>Start Date</label><input type="date" id="filterStart" onchange="fetchRecords()"></div>
        <div><label>End Date</label><input type="date" id="filterEnd" onchange="fetchRecords()"></div>
      </div>

      <button onclick="window.print()" class="no-print" style="background:#6c757d; margin-bottom:10px;">Print / Save Report PDF</button>

      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Student Name</th>
              <th>Reg / Student No</th>
              <th>Class</th>
              <th>Type</th>
              <th>Amount (UGX)</th>
              <th>Registered By</th>
            </tr>
          </thead>
          <tbody id="recordsTable">
            <tr><td colspan="7" style="text-align:center;">Loading records...</td></tr>
          </tbody>
        </table>
      </div>
      <h4 style="text-align:right; margin-top:10px;" id="totalAmount">Total Revenue: UGX 0</h4>
    </div>

  </div>

  <script>
    let currentUser = JSON.parse(localStorage.getItem('muesa_user')) || null;

    if (currentUser) showApp();

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await fetch('/api?action=login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          username: document.getElementById('loginUser').value,
          password: document.getElementById('loginPass').value
        })
      });
      const data = await res.json();
      if (data.success) {
        currentUser = data.user;
        localStorage.setItem('muesa_user', JSON.stringify(currentUser));
        showApp();
      } else {
        document.getElementById('loginError').innerText = data.message;
      }
    });

    function showApp() {
      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('appSection').classList.remove('hidden');
      document.getElementById('userDisplay').innerText = currentUser.username;
      document.getElementById('roleDisplay').innerText = `Role: ${currentUser.role}`;
      fetchRecords();
    }

    function logout() {
      localStorage.removeItem('muesa_user');
      location.reload();
    }

    document.getElementById('regForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        full_name: document.getElementById('fullName').value,
        student_no: document.getElementById('studentNo').value,
        reg_no: document.getElementById('regNo').value,
        year_of_study: document.getElementById('yearOfStudy').value,
        semester: document.getElementById('semester').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        payment_type: document.getElementById('paymentType').value,
        amount: document.getElementById('amount').value,
        academic_year: '2026/2027',
        registered_by_role: currentUser.role,
        registered_by_user: currentUser.username
      };

      const res = await fetch('/api?action=register', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (data.success) {
        alert('Member registered successfully!');
        document.getElementById('regForm').reset();
        fetchRecords();
      } else {
        alert('Error: ' + data.error);
      }
    });

    async function fetchRecords() {
      const year = document.getElementById('filterYear').value;
      const type = document.getElementById('filterType').value;
      const start = document.getElementById('filterStart').value;
      const end = document.getElementById('filterEnd').value;

      const query = new URLSearchParams({ action: 'get_records', year, payment_type: type, start_date: start, end_date: end });
      const res = await fetch(`/api?${query.toString()}`);
      const data = await res.json();

      const tbody = document.getElementById('recordsTable');
      tbody.innerHTML = '';
      let total = 0;

      if (data.records && data.records.length > 0) {
        data.records.forEach(r => {
          total += parseFloat(r.amount);
          const date = new Date(r.created_at).toLocaleDateString();
          tbody.innerHTML += `
            <tr>
              <td>${date}</td>
              <td>${r.full_name}</td>
              <td>${r.reg_no}<br><small>${r.student_no}</small></td>
              <td>${r.year_of_study}<br>${r.semester}</td>
              <td><span class="badge ${r.payment_type === 'Subscription' ? 'bg-sub' : 'bg-renew'}">${r.payment_type}</span></td>
              <td>${parseFloat(r.amount).toLocaleString()}</td>
              <td><small>${r.registered_by_role}<br>(${r.registered_by_user})</small></td>
            </tr>
          `;
        });
      } else {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">No records found.</td></tr>';
      }
      document.getElementById('totalAmount').innerText = `Total Revenue: UGX ${total.toLocaleString()}`;
    }
  </script>
</body>
</html>
