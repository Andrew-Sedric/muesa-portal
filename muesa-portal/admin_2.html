<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUESA Document Vault</title>
  <link rel="icon" type="image/png" href="muesa bg.png">
  <style>
    :root { --navy:#123047; --teal:#008c95; --orange:#e87835; --paper:#f4f7f6; --line:#d8e2e1; --ink:#17333b; --muted:#60767a; }
    * { box-sizing:border-box; } body { margin:0; color:var(--ink); font-family:"Trebuchet MS","Segoe UI",sans-serif; background:var(--paper); }
    .shell { width:min(100% - 32px, 980px); margin:0 auto; padding:28px 0 48px; } .topbar,.panel { background:#fff; border:1px solid var(--line); border-radius:8px; box-shadow:0 10px 26px rgba(18,48,71,.07); }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:18px 20px; margin-bottom:18px; } .brand { display:flex; align-items:center; gap:12px; } .brand img { width:48px; height:48px; object-fit:contain; }
    h1,h2,p { margin-top:0; } h1 { color:var(--navy); font-size:clamp(25px,4vw,36px); margin-bottom:4px; } h2 { color:var(--navy); } .eyebrow { color:var(--orange); font-size:11px; font-weight:800; letter-spacing:1px; text-transform:uppercase; } .muted { color:var(--muted); font-size:14px; }
    .panel { padding:22px; margin-bottom:18px; } .form { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; } label { display:grid; gap:6px; color:var(--navy); font-size:13px; font-weight:800; } label:last-of-type { grid-column:1/-1; } input { width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:5px; font:inherit; } input:focus { outline:3px solid rgba(0,140,149,.14); border-color:var(--teal); } .btn { border:0; border-radius:5px; padding:11px 15px; color:#fff; background:var(--teal); font-weight:800; cursor:pointer; } .message { min-height:20px; color:#ad3e29; font-size:13px; } .message.success { color:#177245; }
    .paper-list { display:grid; gap:9px; } .paper { display:flex; align-items:center; justify-content:space-between; gap:14px; padding:13px; border:1px solid var(--line); border-radius:5px; } .paper strong { display:block; color:var(--navy); } .paper small { color:var(--muted); } .delete { background:#fff0ec; color:#ad3e29; }
    @media(max-width:650px) { .shell { width:min(100% - 20px,980px); padding-top:12px; } .topbar { align-items:flex-start; flex-direction:column; } .form { grid-template-columns:1fr; } label:last-of-type { grid-column:auto; } .paper { align-items:flex-start; flex-direction:column; } }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar"><div class="brand"><img src="muesa bg.png" alt="MUESA crest"><div><div class="eyebrow">Administrative workspace</div><h1>Past Papers &amp; Document Vault</h1><p class="muted">Upload image documents for subscribed association members.</p></div></div><a class="btn" href="admin.html" style="text-decoration:none">Photo administration</a></header>
    <section class="panel"><h2>Upload document</h2><form class="form" id="uploadForm"><label>Subject / Course Code<input id="courseCode" required placeholder="Software Engineering"></label><label>Document Title<input id="title" required placeholder="End of Semester Exam"></label><label>Academic Year<input id="paperYear" required placeholder="2024"></label><label>Display File Name<input id="fileName" required placeholder="SE_2024_Final_Paper.png"></label><label>Image file<input id="imageFile" type="file" accept="image/*" required></label><button class="btn" type="submit">Upload to vault</button></form><p class="message" id="message" role="alert"></p></section>
    <section class="panel"><h2>Uploaded documents</h2><div class="paper-list" id="paperList"><p class="muted">Loading documents...</p></div></section>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    const escapeHtml = value => String(value || '').replace(/[&<>"']/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[char]));
    function readImage(file) { return new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve(reader.result); reader.onerror = () => reject(new Error('Unable to read the selected image.')); reader.readAsDataURL(file); }); }
    function setMessage(text, success = false) { $('message').textContent = text; $('message').className = `message${success ? ' success' : ''}`; }
    async function loadPapers() { const response = await fetch('/api/index_2?action=get_past_papers'); const papers = await response.json(); if (!response.ok) throw new Error(papers.error || 'Unable to load documents.'); $('paperList').innerHTML = papers.length ? papers.map(paper => `<article class="paper"><div><strong>${escapeHtml(paper.course_code)}: ${escapeHtml(paper.title)}</strong><small>${escapeHtml(paper.paper_year)} · ${escapeHtml(paper.file_name)}</small></div><button class="btn delete" data-id="${paper.id}">Delete</button></article>`).join('') : '<p class="muted">No documents uploaded yet.</p>'; }
    $('uploadForm').addEventListener('submit', async event => { event.preventDefault(); const file = $('imageFile').files[0]; if (!file) return; try { setMessage('Uploading...'); const response = await fetch('/api/index_2', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ action:'upload_past_paper', course_code:$('courseCode').value, title:$('title').value, paper_year:$('paperYear').value, file_name:$('fileName').value, image_data:await readImage(file) }) }); const data = await response.json(); if (!response.ok || !data.success) throw new Error(data.error || 'Upload failed.'); $('uploadForm').reset(); setMessage('Document uploaded.', true); await loadPapers(); } catch (error) { setMessage(error.message); } });
    $('paperList').addEventListener('click', async event => { if (!event.target.matches('[data-id]') || !confirm('Delete this document?')) return; try { const response = await fetch('/api/index_2', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ action:'delete_past_paper', id:event.target.dataset.id }) }); const data = await response.json(); if (!response.ok || !data.success) throw new Error(data.error || 'Delete failed.'); await loadPapers(); } catch (error) { setMessage(error.message); } });
    loadPapers().catch(error => { $('paperList').innerHTML = `<p class="message">${escapeHtml(error.message)}</p>`; });
  </script>
</body>
</html>
