<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUESA Document Vault</title>
  <link rel="icon" type="image/png" href="muesa bg.png">
  <style>
    :root { --navy:#123047; --teal:#008c95; --orange:#e87835; --paper:#f4f7f6; --line:#d8e2e1; --ink:#17333b; --muted:#60767a; }
    * { box-sizing:border-box; } body { margin:0; color:var(--ink); font-family:"Trebuchet MS","Segoe UI",sans-serif; background:var(--paper); }
    .shell { width:min(100% - 32px, 980px); margin:0 auto; padding:28px 0 48px; } .topbar,.panel { background:#fff; border:1px solid var(--line); border-radius:8px; box-shadow:0 10px 26px rgba(18,48,71,.07); }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:18px 20px; margin-bottom:18px; } .brand { display:flex; align-items:center; gap:12px; } .brand img { width:48px; height:48px; object-fit:contain; }
    h1,h2,p { margin-top:0; } h1 { color:var(--navy); font-size:clamp(25px,4vw,36px); margin-bottom:4px; } h2 { color:var(--navy); } .eyebrow { color:var(--orange); font-size:11px; font-weight:800; letter-spacing:1px; text-transform:uppercase; } .muted { color:var(--muted); font-size:14px; }
    .panel { padding:22px; margin-bottom:18px; } .form { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; } label { display:grid; gap:6px; color:var(--navy); font-size:13px; font-weight:800; } label:last-of-type { grid-column:1/-1; } input { width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:5px; font:inherit; } input:focus { outline:3px solid rgba(0,140,149,.14); border-color:var(--teal); } .btn { border:0; border-radius:5px; padding:11px 15px; color:#fff; background:var(--teal); font-weight:800; cursor:pointer; } .message { min-height:20px; color:#ad3e29; font-size:13px; } .message.success { color:#177245; }
    .paper-list { display:grid; gap:9px; } .paper { display:flex; align-items:center; justify-content:space-between; gap:14px; padding:13px; border:1px solid var(--line); border-radius:5px; } .paper strong { display:block; color:var(--navy); } .paper small { color:var(--muted); } .delete { background:#fff0ec; color:#ad3e29; } .viewer { position:fixed; inset:0; z-index:10; display:grid; place-items:center; padding:20px; background:rgba(6,29,55,.86); } .viewer[hidden] { display:none; } .viewer-inner { width:min(100%,980px); max-height:100%; overflow:auto; padding:18px; background:#fff; border-radius:8px; } .viewer-head { display:flex; justify-content:space-between; gap:12px; align-items:start; } .viewer canvas { display:block; width:100%; max-height:72vh; object-fit:contain; margin-top:12px; background:var(--paper); }
    @media(max-width:650px) { .shell { width:min(100% - 20px,980px); padding-top:12px; } .topbar { align-items:flex-start; flex-direction:column; } .form { grid-template-columns:1fr; } label:last-of-type { grid-column:auto; } .paper { align-items:flex-start; flex-direction:column; } }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar"><div class="brand"><img src="muesa bg.png" alt="MUESA crest"><div><div class="eyebrow">Administrative workspace</div><h1>Past Papers &amp; Document Vault</h1><p class="muted">Upload one or more pages for students to view.</p></div></div><a class="btn" href="index.html" style="text-decoration:none">Back to portal</a></header>
    <section class="panel"><h2>Upload document</h2><form class="form" id="uploadForm"><label>Subject / Course Code<input id="courseCode" required placeholder="Software Engineering"></label><label>Document Title<input id="title" required placeholder="End of Semester Exam"></label><label>Academic Year<input id="paperYear" required placeholder="2024"></label><label>Display File Name<input id="fileName" required placeholder="SE_2024_Final_Paper.png"></label><label>Paper page image(s)<input id="imageFile" type="file" accept="image/*" multiple required></label><button class="btn" type="submit">Upload to vault</button></form><p class="message" id="message" role="alert"></p></section>
    <section class="panel"><h2>Uploaded documents</h2><div class="paper-list" id="paperList"><p class="muted">Loading documents...</p></div></section>
  </main>
  <div class="viewer" id="viewer" hidden><div class="viewer-inner"><div class="viewer-head"><div><h2 id="viewerTitle"></h2><p class="muted" id="viewerPage"></p></div><div><button class="btn" id="previousPage">Previous</button> <button class="btn" id="nextPage">Next</button> <button class="btn" id="closeViewer">Close</button></div></div><canvas id="paperCanvas"></canvas></div></div>
  <script>
    const $ = id => document.getElementById(id);
    const escapeHtml = value => String(value || '').replace(/[&<>"']/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[char]));
    function readImage(file) { return new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve(reader.result); reader.onerror = () => reject(new Error('Unable to read the selected image.')); reader.readAsDataURL(file); }); }
    function setMessage(text, success = false) { $('message').textContent = text; $('message').className = `message${success ? ' success' : ''}`; }
    let papers = [];
    function groupedPapers() { const groups = new Map(); papers.forEach(paper => { const key = `${paper.course_code}|${paper.title}|${paper.paper_year}`; if (!groups.has(key)) groups.set(key, { ...paper, pages: [] }); groups.get(key).pages.push(paper); }); return Array.from(groups.values()); }
    async function loadPapers() { const response = await fetch('/api/index_2?action=get_past_papers'); papers = await response.json(); if (!response.ok) throw new Error(papers.error || 'Unable to load documents.'); const grouped = groupedPapers(); $('paperList').innerHTML = grouped.length ? grouped.map((paper, index) => `<article class="paper"><div><strong>${escapeHtml(paper.course_code)}: ${escapeHtml(paper.title)}</strong><small>${escapeHtml(paper.paper_year)} · ${paper.pages.length} page(s)</small></div><div><button class="btn view-paper" data-index="${index}">View</button> <button class="btn delete" data-id="${paper.id}">Delete</button></div></article>`).join('') : '<p class="muted">No documents uploaded yet.</p>'; }
    $('uploadForm').addEventListener('submit', async event => { event.preventDefault(); const files = Array.from($('imageFile').files || []); if (!files.length) return; try { setMessage(`Uploading ${files.length} page(s)...`); const response = await fetch('/api/index_2', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ action:'upload_past_paper', course_code:$('courseCode').value, title:$('title').value, paper_year:$('paperYear').value, file_name:files.length === 1 ? $('fileName').value : files.map(file => file.name), image_data:await Promise.all(files.map(readImage)) }) }); const data = await response.json(); if (!response.ok || !data.success) throw new Error(data.error || 'Upload failed.'); $('uploadForm').reset(); setMessage(`${data.pages} page(s) uploaded.`, true); await loadPapers(); } catch (error) { setMessage(error.message); } });
    $('paperList').addEventListener('click', async event => { const viewButton = event.target.closest('.view-paper'); if (viewButton) return openPaper(groupedPapers()[Number(viewButton.dataset.index)]); const deleteButton = event.target.closest('[data-id]'); if (!deleteButton || !confirm('Delete this document and all its pages?')) return; try { const paper = groupedPapers().find(item => String(item.id) === deleteButton.dataset.id); await Promise.all(paper.pages.map(page => fetch('/api/index_2', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ action:'delete_past_paper', id:page.id }) }))); await loadPapers(); } catch (error) { setMessage(error.message); } });
    function openPaper(paper) { let pageIndex = 0; const image = new Image(); const drawPage = () => { image.onload = () => { const canvas = $('paperCanvas'); const scale = Math.min(1, 1500 / image.width); canvas.width = image.width * scale; canvas.height = image.height * scale; canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height); $('viewerPage').textContent = `Page ${pageIndex + 1} of ${paper.pages.length} · ${paper.pages[pageIndex].file_name}`; $('previousPage').disabled = pageIndex === 0; $('nextPage').disabled = pageIndex === paper.pages.length - 1; $('viewer').hidden = false; }; image.src = paper.pages[pageIndex].image_data; }; $('previousPage').onclick = () => { if (pageIndex > 0) { pageIndex -= 1; drawPage(); } }; $('nextPage').onclick = () => { if (pageIndex < paper.pages.length - 1) { pageIndex += 1; drawPage(); } }; drawPage(); }
    $('closeViewer').addEventListener('click', () => { $('viewer').hidden = true; });
    loadPapers().catch(error => { $('paperList').innerHTML = `<p class="message">${escapeHtml(error.message)}</p>`; });
  </script>
</body>
</html>
